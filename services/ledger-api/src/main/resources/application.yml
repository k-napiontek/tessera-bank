# ledger-api - the REST adapter of the ledger.
#
# No Dockerfile, no Compose file and no deployment manifest live in this repository (ADR 0001), so
# every connection detail here is an environment variable with a local default. Packaging and
# deployment belong to the companion platform repositories.
spring:
  application:
    name: ledger-api

  datasource:
    url: ${LEDGER_DB_URL:jdbc:postgresql://localhost:5432/tessera_ledger}
    username: ${LEDGER_DB_USER:ledger}
    password: ${LEDGER_DB_PASSWORD:ledger}
    hikari:
      # A pool larger than the database can serve turns a slow query into a queue of held
      # connections, and every transfer waits behind it.
      maximum-pool-size: ${LEDGER_DB_POOL:16}

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    # An absent field and a null field are different statements in this contract - postedAt is absent
    # until a transfer posts - and a serialiser that emitted nulls for both would erase that.
    default-property-inclusion: non_null

  kafka:
    bootstrap-servers: ${LEDGER_KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # The event is written to the outbox in the postings' transaction, so it is already durable
      # before Kafka hears of it. acks=all is what makes the relay's "mark only after the broker
      # accepted it" mean the broker's replicas accepted it, not one leader that may still fail over.
      acks: all
      properties:
        enable.idempotence: true

  mvc:
    # Every error, including the ones Spring raises before a controller is reached, is an RFC 9457
    # Problem Details document. Without this a missing required header returns Spring's own error
    # body, which is neither problem+json nor anything the contract declares.
    problemdetails:
      enabled: true

server:
  error:
    # The whitelabel error page and its stack traces are the single easiest way to leak an internal
    # exception to a caller, which REQ-API-003 forbids outright.
    whitelabel:
      enabled: false
    include-stacktrace: never
    include-message: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        # Only what an operator and a scrape genuinely need. The default is `health` alone; the
        # temptation is `*`, which exposes heapdump, env and configprops - env alone prints every
        # resolved property, including the database password.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db
      # Splits /actuator/health into /liveness and /readiness. They answer different questions and a
      # platform acts on them differently: a failing liveness probe restarts the pod, a failing
      # readiness probe takes it out of the load balancer.
      probes:
        enabled: true
      # Never `always`. A health detail names the failing component and, for a datasource, the
      # exception it failed with - which is an unauthenticated description of the internals.
      show-details: when-authorized
  health:
    # **The database is in readiness and deliberately not in liveness.**
    #
    # Spring's default readiness group is `readinessState` alone, which reports ready as long as the
    # application context has started - so a ledger that cannot reach PostgreSQL is declared ready
    # and is sent traffic it can only reject. Adding `db` is the whole point of configuring this.
    #
    # It stays out of liveness because restarting the pod does not fix a database outage; it turns
    # one outage into a crash-loop across every instance at once, and then the recovery has to
    # contend with a stampede of reconnecting pods.
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ledger-api

logging:
  level:
    root: INFO

tessera:
  outbox:
    # How often the relay looks for pending events. Small enough that a transfer is announced in well
    # under a second, large enough that an idle service is not polling PostgreSQL continuously.
    relay-interval-ms: ${LEDGER_OUTBOX_INTERVAL_MS:500}
    batch-size: ${LEDGER_OUTBOX_BATCH:100}
    # Bounded on purpose. A relay blocked forever on a broker that is not answering is an outage that
    # looks like a healthy process.
    publish-timeout-ms: ${LEDGER_OUTBOX_PUBLISH_TIMEOUT_MS:10000}
