# recon - the reconciliation between strata 0 and 3, Python 3.12 under uv.
#
# The Python floor is a range rather than a minimum, for the same reason reporting's and
# fraud-scoring's are: ">=3.12" would let a machine with 3.14 resolve a different interpreter from
# the one CLAUDE.md pins the tier to, and the difference would only surface in whichever behaviour
# changed between them.
[project]
name = "recon"
version = "1.0.0"
description = "Reconciles the COBOL account master against the PostgreSQL ledger and reports drift."
requires-python = ">=3.12,<3.13"
dependencies = [
    # psycopg 3. The reconciliation reads PostgreSQL directly, as reporting does: the question is a
    # full-table aggregate over postings, and paging that through a REST endpoint built for one
    # customer's statement would be slower, less exact and no more decoupled.
    "psycopg[binary]>=3.2,<4",
    # The exposition format. A batch job has no endpoint to scrape, so this writes a textfile.
    "prometheus-client>=0.20,<1",
]

[project.scripts]
recon = "recon.main:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    # Real PostgreSQL with the ledger's own Flyway migrations applied. A reader proved against a
    # hand-written schema is verified against a fiction.
    "testcontainers[postgres]>=4.7,<5",
    "ruff>=0.6,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import mode importlib keeps the tests out of the package's namespace, so a test file cannot shadow
# a module it is testing.
addopts = "--import-mode=importlib -q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E,F are the defaults; the rest are the rules that catch the mistakes this repository cares about.
# DTZ earns its place twice over here: a business date read as a local date reconciles the wrong day,
# and a break report stamped with a naive datetime is a break nobody can place in time.
select = ["E", "F", "W", "I", "B", "S", "DTZ", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests assert; S101 forbids assert.
"tests/*" = ["S101"]
