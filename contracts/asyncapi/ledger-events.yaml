# Kafka event contracts for the Tessera Bank estate.
#
# Derived from docs/architecture/canonical-data-model.md. Every schema below traces to a concept
# defined there; nothing is invented here.
#
# Framed from the point of view of services/ledger-core: it sends transfer-posted and receives
# fraud-decision. edge/fraud-scoring and integration/esb-adapter read this same document from the
# opposite side.
asyncapi: 3.0.0

info:
  title: Tessera Bank ledger events
  version: 1.0.0
  description: |
    ## Delivery is at-least-once

    Every consumer of these channels **must** be idempotent. This is not a caution, it is a
    property of the design: `ledger-core` writes its domain event to a transactional outbox in the
    same database transaction as the postings, and a separate relay publishes from that outbox.
    The relay can crash between publishing and marking the row as sent, so it republishes. That is
    the correct trade - it is the only way to avoid the dual-write problem - and the cost is paid
    by consumers, once, deliberately.

    De-duplicate on `transferRef` for transfer events and on `transferRef` plus `modelVersion` for
    fraud decisions. Never de-duplicate on arrival time.

    ## Ordering

    Messages are keyed by `transferRef`, so all events for one transfer land on one partition and
    keep their order relative to each other. There is **no** ordering guarantee between different
    transfers, and none is needed: the ledger is already consistent when the event is published.

    ## Data protection

    No event carries personal data. Account references are pseudonymous identifiers and are the
    minimum these consumers genuinely need.
  license:
    name: MIT
    url: https://github.com/k-napiontek/tessera-bank/blob/main/LICENSE
  contact:
    name: Tessera Bank engineering
    url: https://github.com/k-napiontek/tessera-bank

servers:
  kafka:
    host: kafka.tesserabank.internal:9093
    protocol: kafka-secure
    description: |
      Broker addresses are supplied per environment by the platform repositories, not by this
      contract. The host below is the shape, not a real endpoint.

channels:
  transferPosted:
    address: tessera.ledger.transfer-posted.v1
    title: Transfer posted
    description: |
      One message per transfer that reached `POSTED`. Published from the transactional outbox, so
      delivery is at-least-once and duplicates are expected.

      The version suffix is part of the topic name: a breaking change to the payload creates
      `.v2` beside this one rather than mutating it, so consumers migrate on their own schedule.
    messages:
      transferPosted:
        $ref: '#/components/messages/TransferPosted'
    bindings:
      kafka:
        topic: tessera.ledger.transfer-posted.v1
        partitions: 12
        replicas: 3

  fraudDecision:
    address: tessera.fraud.decision.v1
    title: Fraud decision
    description: |
      One message per scored transfer. A `BLOCK` does not unpost anything by itself - it triggers a
      reversal through the normal reversal path, with its own audit trail.
    messages:
      fraudDecision:
        $ref: '#/components/messages/FraudDecision'
    bindings:
      kafka:
        topic: tessera.fraud.decision.v1
        partitions: 12
        replicas: 3

operations:
  sendTransferPosted:
    action: send
    channel:
      $ref: '#/channels/transferPosted'
    title: Publish a posted transfer
    summary: Relayed from the transactional outbox after the postings commit.
    description: |
      Published by the outbox relay, never by the request thread. The event is written in the same
      transaction as the postings, so it cannot describe a transfer that did not happen - and it
      may be published more than once, so it may describe one that consumers already saw.
    messages:
      - $ref: '#/channels/transferPosted/messages/transferPosted'

  receiveFraudDecision:
    action: receive
    channel:
      $ref: '#/channels/fraudDecision'
    title: Consume a fraud decision
    summary: Scored asynchronously, after the transfer has already posted.
    description: |
      The ledger records the decision against the transfer. Applying the same decision twice must
      be a no-op.
    messages:
      - $ref: '#/channels/fraudDecision/messages/fraudDecision'

components:

  messages:
    TransferPosted:
      name: TransferPosted
      title: Transfer posted
      summary: A balanced pair of postings was committed to the ledger.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/TransferPostedPayload'
      bindings:
        kafka:
          key:
            type: string
            description: '`transferRef`, so every event for one transfer keeps its order.'
            pattern: '^TB[0-9]{18}$'

    FraudDecision:
      name: FraudDecision
      title: Fraud decision
      summary: The outcome of scoring a posted transfer.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/FraudDecisionPayload'
      bindings:
        kafka:
          key:
            type: string
            description: '`transferRef`, matching the transfer-posted key so the two co-partition.'
            pattern: '^TB[0-9]{18}$'

  schemas:

    Money:
      type: object
      description: |
        Minor units plus an ISO 4217 code. Never a decimal string, never a float. The decimal
        position is resolved from the scale table in the canonical model, at presentation only.
      required: [amountMinor, currency]
      additionalProperties: false
      properties:
        amountMinor:
          type: integer
          format: int64
          description: Signed count of minor units. 123456789 with currency PLN is 1 234 567.89.
        currency:
          type: string
          description: ISO 4217 alpha-3, uppercase.
          pattern: '^[A-Z]{3}$'

    Movement:
      type: object
      description: One leg of the double-entry posting.
      required: [movementRef, transferRef, legNo, accountRef, direction, amount, valueDate, postedAt]
      additionalProperties: false
      properties:
        movementRef:
          type: string
          pattern: '^TB[0-9]{18}-[0-9]{2}$'
        transferRef:
          type: string
          pattern: '^TB[0-9]{18}$'
        legNo:
          type: integer
          minimum: 1
          maximum: 99
          description: 1 is the debit leg, 2 the credit leg.
        accountRef:
          type: string
          pattern: '^TB[0-9A-Z]{14}$'
        direction:
          type: string
          description: Direction carries the sign. The amount is always positive.
          enum: [DEBIT, CREDIT]
        amount:
          $ref: '#/components/schemas/Money'
        valueDate:
          type: string
          format: date
        postedAt:
          type: string
          format: date-time
        reference:
          type: string
          maxLength: 35
          description: Remittance information. Never personal data.

    TransferPostedPayload:
      type: object
      required: [transferRef, debitAccountRef, creditAccountRef, amount, postedAt, movements, correlationId]
      additionalProperties: false
      properties:
        transferRef:
          type: string
          pattern: '^TB[0-9]{18}$'
          description: De-duplicate on this. It is stable across republication.
        debitAccountRef:
          type: string
          pattern: '^TB[0-9A-Z]{14}$'
        creditAccountRef:
          type: string
          pattern: '^TB[0-9A-Z]{14}$'
        amount:
          $ref: '#/components/schemas/Money'
        reference:
          type: string
          maxLength: 35
        postedAt:
          type: string
          format: date-time
        reversesTransferRef:
          type: string
          pattern: '^TB[0-9]{18}$'
          description: Present only when this transfer reverses another.
        movements:
          type: array
          description: Exactly two - one debit, one credit, of equal amount and currency.
          minItems: 2
          maxItems: 2
          items:
            $ref: '#/components/schemas/Movement'
        correlationId:
          type: string
          format: uuid
          description: Ties the event back to the customer request that caused it.

    FraudDecisionPayload:
      type: object
      required: [transferRef, decision, score, modelVersion, decidedAt, correlationId]
      additionalProperties: false
      properties:
        transferRef:
          type: string
          pattern: '^TB[0-9]{18}$'
        decision:
          type: string
          enum: [ALLOW, REVIEW, BLOCK]
          description: BLOCK triggers a reversal through the normal path; it never unposts directly.
        score:
          type: integer
          minimum: 0
          maximum: 1000
          description: |
            Higher is riskier. An integer, not a float: the same input must always produce the same
            bytes, and a float makes a decision boundary irreproducible across languages.
        reasonCodes:
          type: array
          description: Why the model decided as it did.
          items:
            type: string
            maxLength: 8
        modelVersion:
          type: string
          maxLength: 32
          description: |
            Which scoring model produced this. Without it the decision cannot be explained months
            later, which is exactly what a regulator asks for.
        decidedAt:
          type: string
          format: date-time
        correlationId:
          type: string
          format: uuid
