# fraud-scoring - stratum 4, Python 3.12 under uv.
#
# The Python floor is a range rather than a minimum. ">=3.12" would let a machine with 3.14 resolve
# a different interpreter from the one the tier is pinned to in CLAUDE.md, and the difference would
# only show up in whichever behaviour changed between them.
[project]
name = "fraud-scoring"
version = "1.0.0"
description = "Asynchronous, explainable fraud scoring for posted transfers."
requires-python = ">=3.12,<3.13"
dependencies = [
    # The librdkafka binding. It exposes the delivery acknowledgement that commit-after-publish
    # depends on: without a callback that reports the broker accepted the decision, "publish, then
    # commit the offset" is an ordering nobody can enforce.
    "confluent-kafka>=2.5,<3",
    # The exposition format and its collectors, from the implementation the ecosystem is tested
    # against.
    "prometheus-client>=0.20,<1",
]

[project.scripts]
fraud-scoring = "fraud_scoring.main:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    # Validates events against the schemas in contracts/asyncapi/, which is what makes the contract
    # test a contract test rather than a restatement of the code.
    "jsonschema>=4.22,<5",
    "PyYAML>=6,<7",
    # A real broker for one test. An adapter proved only against a double is verified by
    # construction rather than by use.
    "testcontainers[kafka]>=4.7,<5",
    "ruff>=0.6,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraud_scoring"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import mode importlib keeps the tests out of the package's namespace, so a test file cannot
# shadow a module it is testing.
addopts = "--import-mode=importlib -q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E,F are the defaults; the rest are the rules that catch the mistakes this repository cares about:
# B for bugbear, S for security, DTZ for naive datetimes - a fraud decision timestamped without a
# zone is a decision nobody can place in time.
select = ["E", "F", "W", "I", "B", "S", "DTZ", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests assert; S101 forbids assert.
"tests/*" = ["S101"]
