# Defaults for local running. Every environment's real values are supplied by the platform
# repositories, not by this file - ADR 0001. What is here is the shape.
spring:
  application:
    name: esb-adapter
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: esb-adapter
      # Never latest. A consumer that skips what accumulated while it was down loses transfers
      # silently, and the mainframe would be short by exactly the messages nobody saw.
      auto-offset-reset: earliest
      # The offset is committed after the work is done, never by a timer while it is still running.
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    listener:
      ack-mode: manual_immediate

tessera:
  # The contracts are read at runtime, in place: the WSDL imports the canonical schema by a relative
  # path, so the directory rather than the file is what this component needs to be pointed at.
  contracts:
    dir: contracts
  esb:
    topic: tessera.ledger.transfer-posted.v1
    dead-letter-topic: tessera.esb.transfer-posted.dlt.v1
    # Supplied per environment by the platform repositories. The default is the development address
    # the WSDL itself advertises.
    customer-master-endpoint: http://localhost:8080/customer-master/services/CustomerMasterService
    # Where the movement records are appended for tonight's COBOL cycle to read. A deployment decides
    # the real path - it is a shared volume the batch scheduler also mounts - and the default below is
    # where mainframe/jcl/run-eod.sh looks when it is given no --movements argument, so the local
    # walkthrough works with nothing configured.
    movement-file: mainframe/data/out/MOVEMENT.DAT
